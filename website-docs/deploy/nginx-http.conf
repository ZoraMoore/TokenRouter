# 仅用于首次签发证书；证书可用后替换为 nginx.conf。
server {
    listen 80;
    listen [::]:80;
    server_name docs.scienceedu.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        root /var/www/docs.scienceedu.me;
        try_files $uri $uri.html $uri/ =404;
    }
}
